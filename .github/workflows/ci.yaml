name: CI
on:
  push:
    branches: [develop, homolog, master]
  pull_request:
    branches: [develop, homolog, master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: ShopEasy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile and run all backend tests
        run: mvn -B -f backend/pom.xml verify dependency:tree -DoutputType=json -DoutputFile=target/dependencies.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit runtime Java dependencies with OSV
        run: node scripts/audit-maven.mjs
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dependency-audit
          path: backend/target/dependency-audit.json
          if-no-files-found: ignore
  frontend:
    name: ShopEasy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: node --test ../scripts/verify-deployment.test.mjs
      - run: npm test -- --watch=false
      - run: npm run build:hosting
        env:
          SHOP_API_URL: https://shopeasy-vm-api.onrender.com
  docker:
    name: ShopEasy Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend deployment image
        run: docker build -t shopeasy-backend:ci backend
      - name: Validate frontend deployment image
        run: docker build -t shopeasy-frontend:ci frontend
  deployment:
    name: Verify Render deployment
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: production-frontend
      url: https://shopeasy-vm.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm the deployed site serves this commit
        run: node scripts/verify-deployment.mjs
        env:
          DEPLOYMENT_URL: https://shopeasy-vm.onrender.com
