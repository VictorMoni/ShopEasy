<a class="skip-link" href="#main-content">Pular para o conteúdo</a>
<header class="header-bar">
  <nav class="nav-container" aria-label="Navegação principal">
    <a routerLink="/" class="brand" aria-label="ShopEasy — página inicial"
      ><span class="brand-symbol" aria-hidden="true">s.</span>shop<span
        >easy</span
      ></a
    >
    <ul class="nav-list">
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          >Início</a
        >
      </li>
      <li *ngIf="loggedIn$ | async">
        <a
          routerLink="/products"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          >Produtos</a
        >
      </li>
      <li *ngIf="loggedIn$ | async">
        <a
          routerLink="/orders"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          >Meus pedidos</a
        >
      </li>
    </ul>
    <ul class="auth-list">
      <li>
        <button type="button" class="secondary theme-toggle" (click)="toggleTheme()"
          [attr.aria-label]="darkMode ? 'Ativar modo claro' : 'Ativar modo escuro'"
          [attr.title]="darkMode ? 'Ativar modo claro' : 'Ativar modo escuro'">
          <svg *ngIf="darkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg *ngIf="!darkMode" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.5 14a8.5 8.5 0 0 1-10.5-10.5A8.5 8.5 0 1 0 20.5 14Z"/></svg>
        </button>
      </li>
      <li *ngIf="!(loggedIn$ | async)">
        <a routerLink="/login" routerLinkActive="active">Entrar</a>
      </li>
      <li *ngIf="!(loggedIn$ | async)">
        <a routerLink="/register" class="button"
          >Criar conta <span aria-hidden="true">↗</span></a
        >
      </li>
      <li *ngIf="loggedIn$ | async">
        <button type="button" class="secondary logout" (click)="logout()">
          Sair da conta
        </button>
      </li>
    </ul>
  </nav>
</header>
